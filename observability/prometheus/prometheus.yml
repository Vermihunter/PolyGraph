global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s
  external_labels:
    stack: polygraph-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: polygraph
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: polygraph

  - job_name: neo4j
    metrics_path: /metrics
    static_configs:
      - targets: ["neo4j:2004"]
        labels:
          service: neo4j

  - job_name: arangodb
    metrics_path: /_db/_system/_admin/metrics
    basic_auth:
      username: root
      password_file: /run/secrets/arango_metrics_password
    static_configs:
      - targets: ["arangodb:8529"]
        labels:
          service: arangodb

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
