services:
  neo4j:
    build:
      context: ./neo4j
      dockerfile: Dockerfile
      args:
        NEO4J_IMAGE_TAG: ${NEO4J_IMAGE_TAG}
    image: cpgdb-neo4j:${NEO4J_IMAGE_TAG}
    container_name: ${NEO4J_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  arangodb:
    build:
      context: ./arango
      dockerfile: Dockerfile
      args:
        ARANGO_IMAGE_TAG: ${ARANGO_IMAGE_TAG}
    image: cpgdb-arangodb:${ARANGO_IMAGE_TAG}
    container_name: ${ARANGO_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${ARANGO_PORT}:8529"
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD}
    volumes:
      - arangodb_data:/var/lib/arangodb3
      - arangodb_apps:/var/lib/arangodb3-apps

volumes:
  neo4j_data:
  neo4j_logs:
  arangodb_data:
  arangodb_apps: