# ArangoDB profile for steady-state BFS benchmarking.
#
# Use together with storage_layer/docker-compose.yml. The base file keeps the
# authoritative volumes/ports/network; this override replaces only the ArangoDB
# command so the benchmark gets a large, explicitly prefilled edge-index cache.
services:
  arangodb:
    command:
      - --server.endpoint=tcp://0.0.0.0:8529
      - --server.export-metrics-api=true
      - --server.export-read-write-metrics=true
      - --server.options-api=${ARANGO_OPTIONS_API:-admin}

      # Request scheduler / HTTP workers.
      - --server.minimal-threads=${ARANGO_SERVER_MINIMAL_THREADS:-16}
      - --server.maximal-threads=${ARANGO_SERVER_MAXIMAL_THREADS:-64}
      - --server.io-threads=${ARANGO_SERVER_IO_THREADS:-4}
      - --server.scheduler-queue-size=${ARANGO_SERVER_SCHEDULER_QUEUE_SIZE:-4096}
      - --server.ongoing-low-priority-multiplier=${ARANGO_SERVER_LOW_PRIORITY_MULTIPLIER:-2}

      # BFS-oriented edge/index cache.
      #
      # 6 GiB cache with a 90% high-water mark gives the cache room to retain
      # the adjacency/index working set instead of starting eviction around the
      # default high-water point. Large adjacency values are allowed and values
      # >=100 B may be transparently compressed.
      - --cache.size=${ARANGO_CACHE_SIZE:-6442450944}
      - --cache.high-water-multiplier=${ARANGO_CACHE_HIGH_WATER_MULTIPLIER:-0.90}
      - --cache.max-cache-value-size=${ARANGO_CACHE_MAX_VALUE_SIZE:-67108864}
      - --cache.min-value-size-for-edge-compression=${ARANGO_CACHE_MIN_VALUE_SIZE_FOR_EDGE_COMPRESSION:-100}

      # Prefill cache-enabled RocksDB/edge indexes when ArangoDB starts.
      - --rocksdb.auto-fill-index-caches-on-startup=${ARANGO_ROCKSDB_AUTO_FILL_INDEX_CACHES_ON_STARTUP:-true}
      - --rocksdb.max-concurrent-index-fill-tasks=${ARANGO_ROCKSDB_MAX_CONCURRENT_INDEX_FILL_TASKS:-8}

      # Underlying RocksDB cache. Keep this separate from the Arango edge/index
      # cache: both serve different parts of the read path.
      - --rocksdb.block-cache-size=${ARANGO_ROCKSDB_BLOCK_CACHE_SIZE:-3221225472}
      - --rocksdb.total-write-buffer-size=${ARANGO_ROCKSDB_WRITE_BUFFER_SIZE:-536870912}
      - --rocksdb.enforce-block-cache-size-limit=${ARANGO_ROCKSDB_ENFORCE_CACHE_LIMIT:-true}

      # Existing AQL memory controls.
      - --query.memory-limit=${ARANGO_QUERY_MEMORY_LIMIT:-536870912}
      - --query.global-memory-limit=${ARANGO_QUERY_GLOBAL_MEMORY_LIMIT:-2147483648}
      - --query.memory-limit-override=${ARANGO_QUERY_MEMORY_LIMIT_OVERRIDE:-false}
      - --query.log-memory-usage-threshold=${ARANGO_QUERY_LOG_MEMORY_THRESHOLD:-268435456}
      - --query.max-runtime=${ARANGO_QUERY_MAX_RUNTIME:-0}
      - --query.log-failed=${ARANGO_QUERY_LOG_FAILED:-true}
