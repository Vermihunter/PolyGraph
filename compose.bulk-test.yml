# Save in the PolyGraph repository root.
# Completely isolated from storage_layer/docker-compose.yml:
# separate Compose project, network, volumes, and host ports.
# TEST-ONLY credentials. Bound to localhost, not suitable for production.
services:
  postgresql:
    image: postgres:17
    environment:
      POSTGRES_DB: polygraph
      POSTGRES_USER: polygraph
      POSTGRES_PASSWORD: polygraph_test_only_123
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./storage_layer/postgresql/init:/docker-entrypoint-initdb.d:ro
      - ./build/bulk-import-test/artifacts:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polygraph -d polygraph"]
      interval: 10s
      timeout: 5s
      retries: 30

  neo4j:
    # Enterprise is used to allow separate database names for offline import.
    # You must be entitled to use Enterprise and accept its license.
    image: neo4j:5.26-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "neo4j/neo4j_test_only_123"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
      NEO4J_server_bolt_advertised__address: "localhost:17687"
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./build/bulk-import-test/artifacts:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_test_only_123 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 8s
      retries: 30
      start_period: 30s

  arangodb:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: arango_test_only_123
    ports:
      - "127.0.0.1:18529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
      - arangodb_apps:/var/lib/arangodb3-apps
      - ./build/bulk-import-test/artifacts:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.endpoint tcp://127.0.0.1:8529 --server.username root --server.password \"$$ARANGO_ROOT_PASSWORD\" --javascript.execute-string 'db._version();' >/dev/null 2>&1"]
      interval: 15s
      timeout: 8s
      retries: 30
      start_period: 30s

volumes:
  postgresql_data:
  neo4j_data:
  neo4j_logs:
  arangodb_data:
  arangodb_apps:
