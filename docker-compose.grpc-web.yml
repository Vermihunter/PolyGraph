services:
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: cpgdb-grpc-web-envoy

    ports:
      - "8081:8081"
      - "9901:9901"

    volumes:
      - ./envoy/envoy.grpc-web.yaml:/etc/envoy/envoy.yaml:ro

    command:
      - envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --log-level
      - debug

    extra_hosts:
      - "host.docker.internal:host-gateway"